name: Build NodeHub IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project NodeHub.xcodeproj \
            -scheme NodeHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
        working-directory: ${{ github.workspace }}

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "NodeHub.app" -type d | head -1)
          rm -rf Payload NodeHub.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          zip -r NodeHub.ipa Payload
          ls -lh NodeHub.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NodeHub.ipa
          path: NodeHub.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
