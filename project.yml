# XcodeGen 配置 — 用 YAML 自动生成 Xcode 项目
# 安装: brew install xcodegen
# 生成: xcodegen generate

name: NodeHub
options:
  bundleIdPrefix: com.liguangming
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_ENTITLEMENTS: ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: NodeHub
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: NO
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于本地代理端口通信"
    INFOPLAYLIST_KEY_NSBonjourServices: ""

targets:
  NodeHub:
    type: application
    platform: iOS
    sources:
      - path: Swift/Models
      - path: Swift/Services
      - path: Swift/ViewModels
      - path: Swift/Views
      - path: Swift/NodeHubApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liguangming.NodeHub
        INFOPLIST_KEY_CFBundleDisplayName: NodeHub
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: NodeHubTunnel
        embed: true
        codeSign: false
        copy:
          destination: plugins
          subpath: ""

  NodeHubTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Swift/NetworkExtension
      - path: Swift/Models/Node.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liguangming.NodeHub.tunnel
        INFOPLIST_KEY_CFBundleDisplayName: NodeHub Tunnel
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        CODE_SIGN_ENTITLEMENTS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies: []
